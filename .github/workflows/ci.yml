name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Integration tests start an embedded Tomcat with an in-memory H2 database (no MySQL needed)
      - name: Run integration tests
        run: mvn -B test
